# Blueprint de Render. La base es Postgres externo (Neon): pega su cadena de conexión en DATABASE_URL.
services:
  - type: web
    name: gestor-directivo-liva
    runtime: docker
    plan: starter
    healthCheckPath: /readyz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: OWNER_TOKEN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_KEY
        sync: false # openssl rand -hex 32 — guárdala en tu gestor de secretos
      - key: MFA_REQUIRED
        value: admin
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPOS
        value: Angel172002/pruebas
